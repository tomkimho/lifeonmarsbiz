// ─── Google Contacts API ───
async function fetchGoogleContacts(token){
  if(!token)throw new Error("No token");
  const resp=await fetch('https://people.googleapis.com/v1/people/me/connections?personFields=names,emailAddresses,phoneNumbers,organizations&pageSize=500&sortOrder=FIRST_NAME_ASCENDING',{headers:{Authorization:`Bearer ${token}`}});
  if(!resp.ok)throw new Error(`API ${resp.status}`);
  const data=await resp.json();
  return(data.connections||[]).map(p=>{
    const name=p.names?.[0]?.displayName||"";
    const email=p.emailAddresses?.[0]?.value||"";
    const phone=p.phoneNumbers?.[0]?.value||"";
    const company=p.organizations?.[0]?.name||"";
    const position=p.organizations?.[0]?.title||"";
    if(!name)return null;
    return{id:"g_"+(name+email).replace(/[^a-zA-Z0-9]/g,"").slice(0,16)+Date.now()%1000,name,email,phone,company,position,notes:"",source:"google"};
  }).filter(Boolean);
}

// ─── Google Drive Backup/Restore ───
const DRIVE_FOLDER='BizPlanner_Backups';
const DRIVE_API='https://www.googleapis.com/drive/v3';
const DRIVE_UPLOAD='https://www.googleapis.com/upload/drive/v3';

async function driveGetToken(allowPopup=false){
  let token=sessionStorage.getItem('bp-gtoken');
  if(token)return token;
  if(!allowPopup)throw new Error("토큰 없음 - 로그아웃 후 다시 로그인해주세요");
  // Manual only: try to get token via popup
  if(fbAuth&&fbGoogle){
    try{
      const result=await fbAuth.signInWithPopup(fbGoogle);
      token=result.credential?.accessToken;
      if(token){sessionStorage.setItem('bp-gtoken',token);return token;}
    }catch(e){
      console.warn("Drive token popup failed:",e);
      throw new Error("로그인이 필요합니다");
    }
  }
  throw new Error("로그인이 필요합니다");
}

async function driveFindOrCreateFolder(token){
  // Find existing folder
  const q=encodeURIComponent(`name='${DRIVE_FOLDER}' and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const resp=await fetch(`${DRIVE_API}/files?q=${q}&spaces=drive&fields=files(id,name)`,{headers:{Authorization:`Bearer ${token}`}});
  if(!resp.ok)throw new Error(`Drive API ${resp.status}`);
  const data=await resp.json();
  if(data.files&&data.files.length>0)return data.files[0].id;
  // Create folder
  const cr=await fetch(`${DRIVE_API}/files`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({name:DRIVE_FOLDER,mimeType:'application/vnd.google-apps.folder'})});
  if(!cr.ok)throw new Error(`Folder create failed ${cr.status}`);
  const folder=await cr.json();
  return folder.id;
}

async function driveBackup(token,backupData){
  const folderId=await driveFindOrCreateFolder(token);
  const now=new Date();
  const fileName=`backup_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}.json`;
  const content=JSON.stringify({...backupData,_backupDate:now.toISOString(),_app:'김호 정신차려!'},null,2);
  const metadata={name:fileName,parents:[folderId],mimeType:'application/json'};
  const boundary='bizplanner_boundary';
  const body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${content}\r\n--${boundary}--`;
  const resp=await fetch(`${DRIVE_UPLOAD}/files?uploadType=multipart`,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':`multipart/related; boundary=${boundary}`},body});
  if(!resp.ok)throw new Error(`Upload failed ${resp.status}`);
  const file=await resp.json();
  return{id:file.id,name:fileName,date:now.toISOString()};
}

async function driveListBackups(token){
  const folderId=await driveFindOrCreateFolder(token);
  const q=encodeURIComponent(`'${folderId}' in parents and trashed=false and mimeType='application/json'`);
  const resp=await fetch(`${DRIVE_API}/files?q=${q}&orderBy=createdTime desc&pageSize=20&fields=files(id,name,createdTime,size)`,{headers:{Authorization:`Bearer ${token}`}});
  if(!resp.ok)throw new Error(`List failed ${resp.status}`);
  const data=await resp.json();
  return data.files||[];
}

async function driveRestore(token,fileId){
  const resp=await fetch(`${DRIVE_API}/files/${fileId}?alt=media`,{headers:{Authorization:`Bearer ${token}`}});
  if(!resp.ok)throw new Error(`Download failed ${resp.status}`);
  return await resp.json();
}

// ─── Countdown Alarm ───
function CountdownAlarm({events}){
  const[now,setNow]=useState(new Date());
  useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t);},[]);
  const up=events.filter(e=>e.alarm!=null&&e.alarm>=0&&e.date&&e.time).map(e=>{
    const[h,m]=e.time.split(":").map(Number);const et=new Date(pD(e.date));et.setHours(h,m,0,0);
    const at=new Date(et.getTime()-(e.alarm||0)*60000);const diff=at-now;return{...e,diff,et,at};
  }).filter(e=>e.diff>-300000&&e.diff<864e5*2).sort((a,b)=>a.diff-b.diff).slice(0,3);
  useEffect(()=>{up.forEach(e=>{if(e.diff<=0&&e.diff>-2000)showNotif(`⏰ ${e.title}`,`${e.date} ${e.time}`);});},[now]);
  if(!up.length)return null;
  const fmtCD=ms=>{if(ms<=0)return"지금!";const h=Math.floor(ms/36e5),m=Math.floor(ms%36e5/6e4),s=Math.floor(ms%6e4/1e3);return h>0?`${h}시간 ${m}분`:m>0?`${m}분 ${s}초`:`${s}초`;};
  return(
    <div style={{background:"linear-gradient(135deg,#0F172A,#1E3A5F)",borderRadius:14,padding:"12px 14px",marginBottom:14}}>
      <div style={{fontSize:10,fontWeight:700,color:"#94A3B8",marginBottom:8,letterSpacing:1.5}}>⏰ COUNTDOWN</div>
      <div style={{display:"flex",flexDirection:"column",gap:6}}>
        {up.map(e=><div key={e.id} style={{display:"flex",alignItems:"center",gap:8,background:"rgba(255,255,255,0.06)",borderRadius:10,padding:"8px 10px"}}>

          <div style={{flex:1,minWidth:0}}><div style={{fontSize:12,fontWeight:600,color:"#F1F5F9",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.title}</div><div style={{fontSize:10,color:"#94A3B8"}}>{e.date} {e.time}</div></div>
          <div style={{background:e.diff<=0?"#EF4444":e.diff<6e5?"#F97316":"#3B82F6",color:"#fff",padding:"3px 8px",borderRadius:20,fontSize:11,fontWeight:700,minWidth:50,textAlign:"center",flexShrink:0}}>{fmtCD(e.diff)}</div>

}

// ─── Dashboard Summary ───
function Dashboard({events,todos}){
  const todayEvs=events.filter(e=>e.date===TODAY||(e.endDate&&e.date<=TODAY&&e.endDate>=TODAY)).length;
  const urgentTodos=todos.filter(t=>!t.completed&&t.priority==="high").length;
  const overdueTodos=todos.filter(t=>!t.completed&&t.dueDate&&t.dueDate<TODAY).length;
  const weekEvents=events.filter(e=>{const d=dBtw(TODAY,e.date);return d>=0&&d<=7;}).length;
  const items=[
    {icon:"📅",label:"오늘",value:todayEvs,color:"#3B82F6",bg:"#EFF6FF"},
    {icon:"📆",label:"이번 주",value:weekEvents,color:"#8B5CF6",bg:"#F5F3FF"},
    {icon:"🔥",label:"긴급",value:urgentTodos,color:"#EF4444",bg:"#FEF2F2"},
    {icon:"⚠️",label:"초과",value:overdueTodos,color:"#F97316",bg:"#FFF7ED"},
  ];
  return(
    <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:14}}>
      {items.map(it=><div key={it.label} style={{background:it.bg,borderRadius:10,padding:"10px 4px",textAlign:"center"}}>
        <div style={{fontSize:14}}>{it.icon}</div>
        <div style={{fontSize:18,fontWeight:800,color:it.color,margin:"1px 0"}}>{it.value}</div>
        <div style={{fontSize:9,color:"#64748B",fontWeight:600}}>{it.label}</div>
      </div>)}
    </div>
  );
}

// ─── Share Modal ───
function ShareModal({item,onClose,contacts}){
  const[copied,setCopied]=useState(false);const[copiedContent,setCopiedContent]=useState(false);
  const[mode,setMode]=useState(null); // null, "email", "sms"
  const[cSearch,setCSearch]=useState("");
  const txt=`[김호 정신차려!] ${item.title||"공유"}\n${item.date?`📅 ${item.date}`:""}${item.time?` ⏰ ${item.time}`:""}\n${item.location?`📍 ${item.location}\n`:""}${item.attendees?`👥 ${item.attendees}\n`:""}${item.memo||item.content||item.decisions||""}`.trim();
  const copy=async(t,setter)=>{try{await navigator.clipboard.writeText(t);setter(true);setTimeout(()=>setter(false),2000);}catch{}};
  const filteredC=(contacts||[]).filter(c=>{if(!cSearch)return true;const s=cSearch.toLowerCase();return c.name.toLowerCase().includes(s)||c.company?.toLowerCase().includes(s)||c.email?.toLowerCase().includes(s);});
  const sendEmail=(email)=>{window.open(`mailto:${email}?subject=${encodeURIComponent(item.title||"공유")}&body=${encodeURIComponent(txt)}`);};
  const sendSms=(phone)=>{window.open(`sms:${phone}?body=${encodeURIComponent(txt)}`);};

  if(mode){
    return(
      <div style={modalOverlay} onClick={onClose}><div style={{...modalCont,maxWidth:380}} onClick={e=>e.stopPropagation()}>

          <button onClick={()=>setMode(null)} style={closeS}>←</button>

        <input value={cSearch} onChange={e=>setCSearch(e.target.value)} placeholder="🔍 이름, 회사, 이메일 검색..." style={{...inpS,marginBottom:8}} autoFocus/>
        {/* Direct send without contact */}
        <button onClick={()=>{mode==="email"?sendEmail(""):sendSms("");}} style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"2px dashed #E2E8F0",background:"#F8FAFC",color:"#64748B",fontSize:12,fontWeight:600,cursor:"pointer",marginBottom:8,textAlign:"left"}}>

        </button>
        <div style={{maxHeight:250,overflow:"auto",display:"flex",flexDirection:"column",gap:4}}>
          {filteredC.length===0&&<div style={{textAlign:"center",padding:16,color:"#94A3B8",fontSize:12}}>연락처가 없습니다</div>}
          {filteredC.map(c=>{
            const hasTarget=mode==="email"?c.email:c.phone;
            if(!hasTarget)return null;
            return(
              <div key={c.id} onClick={()=>{mode==="email"?sendEmail(c.email):sendSms(c.phone);}} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:"#fff",borderRadius:10,cursor:"pointer",boxShadow:"0 1px 3px rgba(0,0,0,0.04)",border:"1px solid #F1F5F9"}}>

                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:600,color:"#1E293B"}}>{c.name}{c.source==="google"&&<span style={{fontSize:8,color:"#EA4335",marginLeft:4}}>G</span>}</div>
                  <div style={{fontSize:11,color:"#64748B",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{mode==="email"?c.email:c.phone}{c.company&&` · ${c.company}`}</div>

    {icon:"📨",label:"두레이",color:"#3E6FE0",tc:"#fff",action:()=>{copy(txt,setCopiedContent);}},

// ─── Settings Modal ───
function SettingsModal({onClose,events,todos,memos,contacts,routines,savedItems,routineItems,memoArchive,todoArchive,onRestore,doorayStatus,onDooraySync,user,cloudSt,onLogin,onLogout,fbReady}){
  const fileRef=useRef(null);
  const[driveMode,setDriveMode]=useState(null); // null, "list", "backing", "restoring"
  const[driveMsg,setDriveMsg]=useState("");
  const[driveFiles,setDriveFiles]=useState([]);
  const[autoBackup,setAutoBackup]=useState(()=>{try{return localStorage.getItem('bp-auto-backup')==='true';}catch{return false;}});

  const getAllData=()=>({
    'bp-events':events.filter(e=>e.source!=="dooray"),
    'bp-todos':todos,'bp-memos':memos,'bp-contacts':contacts,
    'bp-routines':routines,'bp-saved':savedItems,'bp-routine-items':routineItems,'bp-memo-archive':memoArchive,'bp-todo-archive':todoArchive,
  });

  const exportData=()=>{
    const d=JSON.stringify({...getAllData(),exportDate:new Date().toISOString()},null,2);
    const blob=new Blob([d],{type:"application/json"});const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=`BizPlanner_${fmt(new Date())}.json`;a.click();URL.revokeObjectURL(url);
  };
  const importData=async(e)=>{
    const file=e.target.files[0];if(!file)return;
    try{const text=await file.text();const d=JSON.parse(text);
      if(d['bp-todos']||d.todos){onRestore(d);alert("복원 완료!");}
      else alert("올바른 백업 파일이 아닙니다.");
    }catch{alert("파일 오류");}
  };

  // Google Drive Backup
  const doBackup=async()=>{
    setDriveMode("backing");setDriveMsg("백업 중...");
    try{
      const token=await driveGetToken(true);
      const result=await driveBackup(token,getAllData());
      setDriveMsg(`✅ 백업 완료: ${result.name}`);
      setDriveMode(null);
      // Save last backup time
      localStorage.setItem('bp-last-backup',new Date().toISOString());

      console.error("Drive backup:",e);
      if(e.message?.includes("401")||e.message?.includes("403")){sessionStorage.removeItem('bp-gtoken');setDriveMsg("❌ 권한 만료 - 로그아웃 후 다시 로그인해주세요");}
      else setDriveMsg("❌ 백업 실패: "+e.message);
      setDriveMode(null);
    }
  };

  // List backups
  const loadBackups=async()=>{
    setDriveMode("list");setDriveMsg("목록 불러오는 중...");setDriveFiles([]);
    try{
      const token=await driveGetToken(true);
      const files=await driveListBackups(token);
      setDriveFiles(files);
      setDriveMsg(files.length?`${files.length}개 백업 발견`:"백업 없음");
    }catch(e){
      console.error("Drive list:",e);
      if(e.message?.includes("401")||e.message?.includes("403")){sessionStorage.removeItem('bp-gtoken');setDriveMsg("❌ 권한 만료 - 로그아웃 후 다시 로그인해주세요");}
      else setDriveMsg("❌ 목록 로드 실패: "+e.message);
    }
  };

  // Restore from Drive
  const doRestore=async(fileId,fileName)=>{
    if(!confirm(`"${fileName}" 백업으로 복원하시겠습니까?\n현재 데이터가 덮어씌워집니다.`))return;
    setDriveMode("restoring");setDriveMsg("복원 중...");
    try{
      const token=await driveGetToken(true);
      const data=await driveRestore(token,fileId);
      onRestore(data);
      setDriveMsg("✅ 복원 완료!");
      setDriveMode(null);
    }catch(e){
      console.error("Drive restore:",e);
      setDriveMsg("❌ 복원 실패: "+e.message);
      setDriveMode(null);
    }
  };

  const toggleAutoBackup=(v)=>{
    setAutoBackup(v);
    localStorage.setItem('bp-auto-backup',v?'true':'false');

  return(

      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {/* Cloud Account */}
        <div style={{background:user?"#EFF6FF":"#F8FAFC",borderRadius:10,padding:12}}>
          <div style={{fontSize:13,fontWeight:700,color:"#1E293B",marginBottom:6}}>☁️ 클라우드 동기화</div>

            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>

              <div><div style={{fontSize:12,fontWeight:600,color:"#1E293B"}}>{user.displayName||"사용자"}</div>
                <div style={{fontSize:10,color:"#64748B"}}>{user.email}</div></div>
            </div>
            <div style={{fontSize:11,color:cloudSt==="synced"?"#059669":cloudSt==="syncing"?"#D97706":"#94A3B8",marginBottom:6}}>
              {cloudSt==="synced"?"✅ 클라우드 동기화됨":cloudSt==="syncing"?"⏳ 동기화 중...":cloudSt==="error"?"❌ 연결 오류":"대기 중"}</div>
            <button onClick={onLogout} style={{...btnS,background:"#FEE2E2",color:"#DC2626",width:"100%",padding:"8px 0",fontSize:12}}>로그아웃</button>

        </div>

        {/* Google Drive Backup */}
        {user&&<div style={{background:"#FFFBEB",borderRadius:10,padding:12}}>
          <div style={{fontSize:13,fontWeight:700,color:"#1E293B",marginBottom:4}}>💾 Google Drive 백업</div>
          <div style={{fontSize:10,color:"#92400E",marginBottom:8}}>데이터를 Google Drive에 안전하게 백업합니다</div>
          {lastBackup&&<div style={{fontSize:10,color:"#64748B",marginBottom:6}}>마지막 백업: {new Date(lastBackup).toLocaleString("ko-KR")}</div>}

            </button>
            <button onClick={loadBackups} disabled={driveMode==="list"} style={{...btnS,background:"#92400E",color:"#fff",flex:1,padding:"9px 0",fontSize:12}}>
              📂 복원 목록

          </div>
          {/* Auto backup toggle */}

          <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:6}}>

// ─── Calendar ───
function Calendar({currentDate,selectedDate,onSelectDate,events,onMonthChange,onToday}){
  const yr=currentDate.getFullYear(),mo=currentDate.getMonth();
  const fd=new Date(yr,mo,1).getDay(),dim=new Date(yr,mo+1,0).getDate();
  const evDates={};
  events.forEach(e=>{
    if(!e.date) return;
    // Multi-day: mark all days in range
    if(e.endDate && e.endDate > e.date){
      let cur = pD(e.date);
      const end = pD(e.endDate);
      while(cur <= end){
        const ds = fmt(cur);
        if(!evDates[ds]) evDates[ds]=[];
        evDates[ds].push(e);
        cur = new Date(cur.getTime()+864e5);
      }
    } else {
      if(!evDates[e.date]) evDates[e.date]=[];
      evDates[e.date].push(e);
    }
  });
  const cells=[];for(let i=0;i<fd;i++)cells.push(null);for(let d=1;d<=dim;d++)cells.push(d);
  return(
    <div style={{background:"#fff",borderRadius:14,padding:"14px 10px",boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
        <button onClick={()=>onMonthChange(-1)} style={navS}>◂</button>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontWeight:800,fontSize:16,color:"#1E293B"}}>{yr}년 {MONTHS_KR[mo]}</span>
          <button onClick={onToday} style={{fontSize:9,padding:"2px 7px",borderRadius:6,border:"1px solid #E2E8F0",background:"#F8FAFC",color:"#3B82F6",fontWeight:700,cursor:"pointer"}}>오늘</button>
        </div>
        <button onClick={()=>onMonthChange(1)} style={navS}>▸</button>
      </div>

        {memo&&<button onClick={()=>setConfirmDel(true)} style={{...btnS,background:"#FEE2E2",color:"#DC2626",fontSize:12}}>삭제</button>}
        {memo&&onArchive&&<button onClick={()=>onArchive({...f})} title="완료 처리 → 보관함으로 이동" style={{...btnS,background:"#DCFCE7",color:"#15803D",fontSize:12}}>✅ 완료</button>}
        <div style={{flex:1}}/><button onClick={onClose} style={{...btnS,background:"#F1F5F9",color:"#64748B",fontSize:12}}>취소</button>
        <button onClick={()=>{if(f.title.trim())onSave(f);}} style={{...btnS,background:"#1E293B",color:"#fff",fontSize:12,opacity:f.title.trim()?1:0.4}}>저장</button></div>
      {confirmDel&&<ConfirmDialog message={`"${memo.title}" 삭제?`} onConfirm={()=>onDelete(memo.id)} onCancel={()=>setConfirmDel(false)}/>}
    </div></div>
  );
}

// ─── Routine Tab ───
function RoutineTab({routines,onToggle,today,items,onUpdateItems}){
  const[view,setView]=useState("today");
  const[editing,setEditing]=useState(false);
  const[editItem,setEditItem]=useState(null); // null=closed, {}=new, {id:..}=edit
  const[eiIcon,setEiIcon]=useState("⭐");const[eiLabel,setEiLabel]=useState("");const[eiShort,setEiShort]=useState("");
  const[eiDays,setEiDays]=useState([]);const[eiTime,setEiTime]=useState("");
  const ITEMS=items;
  const TODAY_ITEMS=ITEMS.filter(r=>routineActive(r,today));
  const todayData=routines[today]||{};
  const done=TODAY_ITEMS.filter(r=>todayData[r.id]).length;
  const total=TODAY_ITEMS.length;
  const pct=total>0?Math.round(done/total*100):0;

  const calcStats=(days)=>{
    const result={};
    let totalDone=0,totalPossible=0;
    ITEMS.forEach(r=>{
      const active=days.filter(d=>routineActive(r,d));
      let cnt=0;active.forEach(d=>{if(routines[d]&&routines[d][r.id])cnt++;});
      result[r.id]={done:cnt,total:active.length,pct:active.length>0?Math.round(cnt/active.length*100):0};
      totalDone+=cnt;totalPossible+=active.length;
    });
    result._overall={done:totalDone,total:totalPossible,pct:totalPossible>0?Math.round(totalDone/totalPossible*100):0};result._days=days;return result;
  };
  const getDays=(type)=>{const d=[];const now=new Date();
    if(type==="week"){for(let i=6;i>=0;i--){const t=new Date(now);t.setDate(t.getDate()-i);d.push(fmt(t));}}
    else if(type==="month"){const y=now.getFullYear(),m=now.getMonth();for(let i=1;i<=now.getDate();i++)d.push(fmt(new Date(y,m,i)));}
    else if(type==="year"){const y=now.getFullYear();let cur=new Date(y,0,1);while(cur<=now){d.push(fmt(cur));cur=new Date(cur.getTime()+864e5);}}
    return d;};
  let streak=0;
  {let d=new Date();while(true){const ds=fmt(d);const rd=routines[ds]||{};const act=ITEMS.filter(r=>routineActive(r,ds));if(act.length>0&&act.every(r=>rd[r.id])){streak++;d=new Date(d.getTime()-864e5);}else break;}}
  const stats=view!=="today"?calcStats(getDays(view)):null;

  const openAdd=()=>{setEiIcon("⭐");setEiLabel("");setEiShort("");setEiDays([]);setEiTime("");setEditItem({});};
  const openEdit=(r)=>{setEiIcon(r.icon);setEiLabel(r.label);setEiShort(r.short);setEiDays(r.days||[]);setEiTime(r.time||"");setEditItem(r);};
  const toggleDay=(d)=>setEiDays(prev=>prev.includes(d)?prev.filter(x=>x!==d):[...prev,d].sort());
  const saveItem=()=>{
    if(!eiLabel.trim())return;
    const fields={icon:eiIcon,label:eiLabel.trim(),short:eiShort.trim()||eiLabel.trim().substring(0,4),days:eiDays.length?eiDays:undefined,time:eiTime||undefined};
    let next;
    if(editItem.id){next=ITEMS.map(r=>r.id===editItem.id?{...r,...fields}:r);}
    else{next=[...ITEMS,{id:"r_"+Date.now(),...fields}];}
    onUpdateItems(next);setEditItem(null);
  };
  const schedLabel=(r)=>{if(!r.days||!r.days.length)return null;return `매주 ${r.days.map(d=>DAYS_KR[d]).join("·")}${r.time?" "+r.time:""}`;};
  const deleteItem=(id)=>{onUpdateItems(ITEMS.filter(r=>r.id!==id));setEditItem(null);};
  const moveItem=(idx,dir)=>{const n=[...ITEMS];const t=n[idx];n[idx]=n[idx+dir];n[idx+dir]=t;onUpdateItems(n);};

  const icons=["💪","📗","📘","📚","✍️","💬","🏃","🧘","💊","🎯","📊","💻","🎵","🌍","⭐","🔥","💡","📖","🗣️","✅"];

  return(<div>
    {/* Today Progress */}
    <div style={{background:"linear-gradient(135deg,#0F172A,#1E3A5F)",borderRadius:16,padding:"16px 14px",marginBottom:12}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div><div style={{fontSize:10,fontWeight:700,color:"#94A3B8",letterSpacing:1.5}}>🔥 오늘의 루틴</div>
          <div style={{fontSize:13,fontWeight:700,color:"#E2E8F0",marginTop:2}}>{(()=>{const d=new Date();return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS_KR[d.getDay()]})`})()}</div>
          <div style={{fontSize:22,fontWeight:900,color:"#fff",marginTop:2}}>{done}/{total} <span style={{fontSize:13,color:pct===100?"#4ADE80":"#FBBF24"}}>{pct}%</span></div></div>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:28,fontWeight:900,color:streak>0?"#F97316":"#475569"}}>{streak}</div>
          <div style={{fontSize:9,color:"#94A3B8",fontWeight:600}}>연속일</div></div>
      </div>
      <div style={{background:"rgba(255,255,255,0.1)",borderRadius:10,height:8,overflow:"hidden"}}>
        <div style={{width:`${pct}%`,height:"100%",background:pct===100?"linear-gradient(90deg,#4ADE80,#22C55E)":"linear-gradient(90deg,#3B82F6,#8B5CF6)",borderRadius:10,transition:"width 0.5s"}}/>
      </div>
      {pct===100&&<div style={{textAlign:"center",marginTop:8,fontSize:12,color:"#4ADE80",fontWeight:700}}>🎉 오늘 루틴 완료!</div>}
    </div>

    {/* Edit toggle + Add button */}
    <div style={{display:"flex",justifyContent:"flex-end",gap:6,marginBottom:8}}>
      <button onClick={()=>setEditing(!editing)} style={{border:"none",background:editing?"#1E293B":"#F1F5F9",color:editing?"#fff":"#64748B",borderRadius:8,padding:"5px 10px",fontSize:10,fontWeight:600,cursor:"pointer"}}>{editing?"✓ 완료":"✏️ 편집"}</button>
      {editing&&<button onClick={openAdd} style={{border:"none",background:"#3B82F6",color:"#fff",borderRadius:8,padding:"5px 10px",fontSize:10,fontWeight:600,cursor:"pointer"}}>+ 추가</button>}
    </div>

    {/* Edit Modal */}
    {editItem!==null&&<div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"rgba(0,0,0,0.5)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:20}} onClick={()=>setEditItem(null)}>
      <div onClick={e=>e.stopPropagation()} style={{background:"#fff",borderRadius:16,padding:20,width:"100%",maxWidth:360,boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}}>
        <div style={{fontSize:16,fontWeight:800,marginBottom:14}}>{editItem.id?"루틴 수정":"루틴 추가"}</div>
        <div style={{fontSize:11,fontWeight:600,color:"#64748B",marginBottom:6}}>아이콘</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:12}}>
          {icons.map(ic=><button key={ic} onClick={()=>setEiIcon(ic)} style={{width:32,height:32,borderRadius:8,border:eiIcon===ic?"2px solid #3B82F6":"2px solid #E2E8F0",background:eiIcon===ic?"#EFF6FF":"#fff",fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>{ic}</button>)}
        </div>
        <div style={{fontSize:11,fontWeight:600,color:"#64748B",marginBottom:4}}>루틴명 *</div>
        <input value={eiLabel} onChange={e=>setEiLabel(e.target.value)} placeholder="예: 운동 30분 이상" style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"2px solid #E2E8F0",fontSize:14,marginBottom:10,boxSizing:"border-box"}}/>
        <div style={{fontSize:11,fontWeight:600,color:"#64748B",marginBottom:4}}>짧은 이름 (통계용)</div>
        <input value={eiShort} onChange={e=>setEiShort(e.target.value)} placeholder="예: 운동" style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"2px solid #E2E8F0",fontSize:14,marginBottom:10,boxSizing:"border-box"}}/>
        <div style={{fontSize:11,fontWeight:600,color:"#64748B",marginBottom:4}}>반복 요일 <span style={{fontWeight:400,color:"#94A3B8"}}>(미선택 = 매일)</span></div>
        <div style={{display:"flex",gap:4,marginBottom:10}}>
          {DAYS_KR.map((d,i)=><button key={i} onClick={()=>toggleDay(i)} style={{flex:1,padding:"7px 0",borderRadius:8,border:eiDays.includes(i)?"2px solid #3B82F6":"2px solid #E2E8F0",background:eiDays.includes(i)?"#3B82F6":"#fff",color:eiDays.includes(i)?"#fff":i===0?"#EF4444":i===6?"#3B82F6":"#64748B",fontSize:12,fontWeight:700,cursor:"pointer"}}>{d}</button>)}
        </div>
        <div style={{fontSize:11,fontWeight:600,color:"#64748B",marginBottom:4}}>시간 <span style={{fontWeight:400,color:"#94A3B8"}}>(선택)</span></div>
        <input type="time" value={eiTime} onChange={e=>setEiTime(e.target.value)} style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"2px solid #E2E8F0",fontSize:14,marginBottom:14,boxSizing:"border-box"}}/>
        <div style={{display:"flex",gap:8}}>
          {editItem.id&&<button onClick={()=>deleteItem(editItem.id)} style={{padding:"10px 0",borderRadius:10,border:"none",background:"#FEE2E2",color:"#DC2626",fontSize:13,fontWeight:700,cursor:"pointer",flex:1}}>삭제</button>}
          <button onClick={()=>setEditItem(null)} style={{padding:"10px 0",borderRadius:10,border:"2px solid #E2E8F0",background:"#fff",color:"#64748B",fontSize:13,fontWeight:600,cursor:"pointer",flex:1}}>취소</button>
          <button onClick={saveItem} style={{padding:"10px 0",borderRadius:10,border:"none",background:"#3B82F6",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",flex:1.5}}>저장</button>
        </div>
      </div>
    </div>}

    {/* Checklist */}
    <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:14}}>
      {(editing?ITEMS:TODAY_ITEMS).map((r,i)=>{const idx=ITEMS.indexOf(r);const checked=!!todayData[r.id];const sched=schedLabel(r);const activeToday=routineActive(r,today);const isWeekly=!!sched;return(
        <div key={r.id} style={{display:"flex",alignItems:"center",gap:6,opacity:editing&&!activeToday?0.55:1}}>
          <div onClick={()=>!editing&&onToggle(today,r.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 14px",background:checked?"#F0FDF4":isWeekly?"#FFFBEB":"#fff",borderRadius:12,cursor:editing?"default":"pointer",borderLeft:`4px solid ${checked?"#22C55E":isWeekly?"#F59E0B":"#E2E8F0"}`,boxShadow:"0 1px 3px rgba(0,0,0,0.04)",transition:"all 0.2s",flex:1,minWidth:0}}>
            <div style={{width:24,height:24,borderRadius:7,border:`2px solid ${checked?"#22C55E":"#CBD5E1"}`,background:checked?"#22C55E":"#fff",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontSize:14,fontWeight:700,flexShrink:0,transition:"all 0.2s"}}>
              {checked&&"✓"}</div>
            <span style={{fontSize:18,flexShrink:0}}>{r.icon}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:14,fontWeight:600,color:checked?"#16A34A":"#1E293B",textDecoration:checked?"line-through":"none",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.label}</div>
              {sched&&<div style={{fontSize:10,fontWeight:700,color:"#D97706",marginTop:2}}>🔁 {sched}</div>}
            </div>
            {checked&&!editing&&<span style={{fontSize:10,color:"#22C55E",fontWeight:700}}>완료</span>}
          </div>
          {editing&&<div style={{display:"flex",flexDirection:"column",gap:2,flexShrink:0}}>
            {idx>0&&<button onClick={()=>moveItem(idx,-1)} style={{border:"none",background:"#F1F5F9",borderRadius:4,width:24,height:20,cursor:"pointer",fontSize:10,color:"#64748B"}}>▲</button>}
            {idx<ITEMS.length-1&&<button onClick={()=>moveItem(idx,1)} style={{border:"none",background:"#F1F5F9",borderRadius:4,width:24,height:20,cursor:"pointer",fontSize:10,color:"#64748B"}}>▼</button>}
          </div>}
          {editing&&<button onClick={()=>openEdit(r)} style={{border:"none",background:"#EFF6FF",borderRadius:8,width:32,height:32,cursor:"pointer",fontSize:14,flexShrink:0,color:"#3B82F6"}}>✏️</button>}
        </div>);})}
    </div>

    {/* Stats Toggle */}
    <div style={{display:"flex",gap:4,marginBottom:10}}>
      {[["today","오늘"],["week","주간"],["month","월간"],["year","연간"]].map(([k,l])=>
        <button key={k} onClick={()=>setView(k)} style={{flex:1,padding:"7px 0",borderRadius:8,border:view===k?"2px solid #1E293B":"2px solid #E2E8F0",background:view===k?"#1E293B":"#fff",color:view===k?"#fff":"#64748B",fontWeight:700,fontSize:11,cursor:"pointer"}}>{l}</button>)}
    </div>

    {/* Stats View */}
    {stats&&<div style={{background:"#fff",borderRadius:14,padding:14,boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
        <div style={{fontSize:14,fontWeight:700,color:"#1E293B"}}>📊 {view==="week"?"주간":view==="month"?"월간":"연간"} 통계</div>
        <div style={{fontSize:22,fontWeight:900,color:stats._overall.pct>=80?"#22C55E":stats._overall.pct>=50?"#F59E0B":"#EF4444"}}>{stats._overall.pct}%</div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8}}>
        {ITEMS.map(r=>{const s=stats[r.id];if(!s||s.total===0)return null;return(
          <div key={r.id}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
              <span style={{fontSize:12,fontWeight:600,color:"#1E293B"}}>{r.icon} {r.short}</span>
              <span style={{fontSize:11,color:"#64748B"}}>{s.done}/{s.total}일 ({s.pct}%)</span>
            </div>
            <div style={{background:"#F1F5F9",borderRadius:6,height:6,overflow:"hidden"}}>
              <div style={{width:`${s.pct}%`,height:"100%",background:s.pct>=80?"#22C55E":s.pct>=50?"#F59E0B":"#EF4444",borderRadius:6,transition:"width 0.4s"}}/>
            </div>
          </div>);})}
      </div>
      {view==="week"&&<div style={{marginTop:12}}>
        <div style={{fontSize:11,fontWeight:700,color:"#64748B",marginBottom:6}}>일별 달성</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
          {stats._days.map(d=>{const rd=routines[d]||{};const act=ITEMS.filter(r=>routineActive(r,d));const cnt=act.filter(r=>rd[r.id]).length;const full=act.length>0&&cnt===act.length;const dp=pD(d);
            return(<div key={d} style={{textAlign:"center",padding:"4px 0",borderRadius:6,background:full?"#DCFCE7":cnt>0?"#FEF3C7":"#F1F5F9"}}>
              <div style={{fontSize:8,color:"#94A3B8"}}>{DAYS_KR[dp.getDay()]}</div>
              <div style={{fontSize:12,fontWeight:800,color:full?"#22C55E":cnt>0?"#F59E0B":"#CBD5E1"}}>{cnt}/{act.length}</div>
              <div style={{fontSize:7,color:"#94A3B8"}}>{dp.getDate()}일</div>
            </div>);})}
        </div>
      </div>}
    </div>}
  </div>);
}

            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6}}>
              {[{l:"전체",v:todos.length,c:"#3B82F6"},{l:"완료율",v:`${todos.length>0?Math.round(todos.filter(t=>t.completed).length/todos.length*100):0}%`,c:"#10B981"},
                {l:"평균소요",v:(()=>{const cd=todos.filter(t=>t.completed&&t.completedDate);return cd.length?`${Math.round(cd.reduce((s,t)=>s+dBtw(t.createdDate,t.completedDate),0)/cd.length)}일`:"-";})(),c:"#F59E0B"},
                {l:"초과",v:todos.filter(t=>!t.completed&&t.dueDate&&t.dueDate<TODAY).length,c:"#EF4444"},
              ].map(s=><div key={s.l} style={{textAlign:"center"}}><div style={{fontSize:18,fontWeight:800,color:s.c}}>{s.v}</div><div style={{fontSize:9,color:"#94A3B8"}}>{s.l}</div></div>)}
            </div>
          </div>}
          </>}
        </>}

        {/* ═══ MEMO ═══ */}
        {tab==="memo"&&<>
          <div style={{display:"flex",gap:4,marginBottom:8}}>
            <button onClick={()=>setMemoView("active")} style={{flex:1,padding:"7px 0",borderRadius:8,border:memoView==="active"?"2px solid #1E293B":"2px solid #E2E8F0",background:memoView==="active"?"#1E293B":"#fff",color:memoView==="active"?"#fff":"#64748B",fontWeight:700,fontSize:11,cursor:"pointer"}}>📝 진행중 {memos.length}</button>
            <button onClick={()=>setMemoView("archive")} style={{flex:1,padding:"7px 0",borderRadius:8,border:memoView==="archive"?"2px solid #15803D":"2px solid #E2E8F0",background:memoView==="archive"?"#15803D":"#fff",color:memoView==="archive"?"#fff":"#64748B",fontWeight:700,fontSize:11,cursor:"pointer"}}>📦 완료 보관함 {memoArchive.length}</button>
          </div>
          <div style={{display:"flex",gap:4,marginBottom:10,flexWrap:"wrap"}}>
            <button onClick={()=>setMemoFilt("all")} style={{padding:"4px 8px",borderRadius:16,border:memoFilt==="all"?"2px solid #1E293B":"2px solid #E2E8F0",background:memoFilt==="all"?"#1E293B":"#fff",color:memoFilt==="all"?"#fff":"#64748B",fontWeight:600,fontSize:10,cursor:"pointer"}}>전체</button>
            {Object.entries(MEMO_T).map(([k,v])=><button key={k} onClick={()=>setMemoFilt(k)} style={{padding:"4px 8px",borderRadius:16,border:memoFilt===k?`2px solid ${v.color}`:"2px solid #E2E8F0",background:memoFilt===k?v.color+"18":"#fff",color:memoFilt===k?v.color:"#64748B",fontWeight:600,fontSize:10,cursor:"pointer"}}>{v.icon} {v.label}</button>)}
          </div>
          {memoView==="archive"&&<>
            <input value={archQ} onChange={e=>setArchQ(e.target.value)} placeholder="🔍 보관함 검색 (제목·내용·결정사항·액션·참석자·태그)" style={{width:"100%",padding:"9px 12px",borderRadius:10,border:"2px solid #BBF7D0",fontSize:13,marginBottom:8,boxSizing:"border-box",background:"#F0FDF4"}}/>
            {fArch.length===0?<div style={{textAlign:"center",padding:"30px 0",color:"#94A3B8"}}><div style={{fontSize:28}}>📦</div><div style={{fontSize:13,marginTop:4}}>{archQ?"검색 결과 없음":"완료된 메모가 없습니다"}</div><div style={{fontSize:11,marginTop:4,color:"#CBD5E1"}}>메모를 열고 ✅ 완료를 누르면 이곳에 보관됩니다</div></div>
            :<div style={{display:"flex",flexDirection:"column",gap:6}}>
              {fArch.map(m=>{const mt=MEMO_T[m.type]||MEMO_T.free;const ad=(m.archivedAt||"").substring(0,10);return(
                <div key={m.id} style={{background:"#F8FAFC",borderRadius:10,padding:"10px 12px",borderLeft:`4px solid ${mt.color}`,boxShadow:"0 1px 3px rgba(0,0,0,0.04)",opacity:0.92}}>
                  <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:2}}>
                    <span style={{fontSize:12}}>{mt.icon}</span>
                    <span style={{fontSize:8,background:mt.color+"20",color:mt.color,borderRadius:3,padding:"0px 4px",fontWeight:700}}>{mt.label}</span>
                    <span style={{fontWeight:600,fontSize:13,color:"#334155",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.title}</span>
                    <span style={{fontSize:10,color:"#94A3B8",flexShrink:0}}>{m.date}</span>
                  </div>
                  {m.content&&<div style={{fontSize:11,color:"#64748B",marginLeft:18,whiteSpace:"pre-wrap",maxHeight:60,overflow:"hidden"}}>{m.content}</div>}
                  {m.decisions&&<div style={{fontSize:10,color:"#059669",marginLeft:18,marginTop:1}}>✅ {m.decisions}</div>}
                  {m.actionItems&&<div style={{fontSize:10,color:"#7C3AED",marginLeft:18,marginTop:1}}>🎯 {m.actionItems}</div>}
                  <div style={{display:"flex",alignItems:"center",gap:6,marginTop:6,marginLeft:18}}>
                    <span style={{fontSize:9,color:"#94A3B8",flex:1}}>완료 {ad}</span>
                    <button onClick={()=>setShareItem({title:m.title,date:m.date,content:`[${mt.label}] ${m.title}\n📅 ${m.date}${m.content?`\n${m.content}`:""}${m.decisions?`\n✅ 결정사항: ${m.decisions}`:""}${m.actionItems?`\n📋 액션: ${m.actionItems}`:""}`})} style={{border:"none",background:"#F1F5F9",borderRadius:6,padding:"4px 8px",cursor:"pointer",fontSize:10,color:"#64748B"}}>📤</button>
                    <button onClick={()=>unarchiveMe(m.id)} style={{border:"none",background:"#EFF6FF",borderRadius:6,padding:"4px 8px",cursor:"pointer",fontSize:10,fontWeight:700,color:"#2563EB"}}>↩ 복원</button>
                    <button onClick={()=>{if(confirm(`"${m.title}" 영구 삭제?`))delArchived(m.id);}} style={{border:"none",background:"#FEE2E2",borderRadius:6,padding:"4px 8px",cursor:"pointer",fontSize:10,fontWeight:700,color:"#DC2626"}}>삭제</button>
                  </div>
                </div>);})}</div>}
          </>}
          {memoView==="active"&&(fMemos.length===0?<div style={{textAlign:"center",padding:"30px 0",color:"#94A3B8"}}><div style={{fontSize:28}}>📝</div><div style={{fontSize:13,marginTop:4}}>메모 없음</div></div>
          :<div style={{display:"flex",flexDirection:"column",gap:6}}>
            {fMemos.map(m=>{const mt=MEMO_T[m.type]||MEMO_T.free;return(
              <div key={m.id} onClick={()=>{setEditMe(m);setShowMF(true);}} style={{background:"#fff",borderRadius:10,padding:"10px 12px",borderLeft:`4px solid ${mt.color}`,boxShadow:"0 1px 3px rgba(0,0,0,0.04)",cursor:"pointer"}}>
                <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:2}}>
                  <span style={{fontSize:12}}>{mt.icon}</span>
                  <span style={{fontSize:8,background:mt.color+"20",color:mt.color,borderRadius:3,padding:"0px 4px",fontWeight:700}}>{mt.label}</span>
                  <span style={{fontWeight:600,fontSize:13,color:"#1E293B",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",wordBreak:"keep-all"}}>{m.title}</span>
                  <button onClick={e=>{e.stopPropagation();archiveMe(m.id);}} title="완료 → 보관함" style={{border:"none",background:"#DCFCE7",borderRadius:6,padding:"4px 6px",cursor:"pointer",fontSize:11,flexShrink:0,color:"#15803D",fontWeight:700}}>✓</button>
                  <button onClick={e=>{e.stopPropagation();setShareItem({title:m.title,date:m.date,content:`[${mt.label}] ${m.title}\n📅 ${m.date}${m.content?`\n${m.content}`:""}${m.decisions?`\n✅ 결정사항: ${m.decisions}`:""}${m.actionItems?`\n📋 액션: ${m.actionItems}`:""}`});}} style={{border:"none",background:"#F1F5F9",borderRadius:6,padding:"4px 6px",cursor:"pointer",fontSize:11,flexShrink:0,color:"#64748B"}}>📤</button>
                  <span style={{fontSize:10,color:"#94A3B8",flexShrink:0}}>{m.date}</span>
                </div>
                {m.content&&<div style={{fontSize:11,color:"#64748B",marginLeft:18,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{m.content}</div>}
                {m.decisions&&<div style={{fontSize:10,color:"#059669",marginLeft:18,marginTop:1}}>✅ {m.decisions.substring(0,40)}{m.decisions.length>40?"...":""}</div>}
              </div>);})}</div>)}
        </>}

        {/* ═══ CONTACTS ═══ */}
        {tab==="contacts"&&<>
          {/* Google Contacts Import */}
          {user&&<div style={{marginBottom:10}}>
            <button onClick={importGoogleContacts} disabled={gImporting} style={{width:"100%",padding:"10px 14px",borderRadius:10,border:"2px solid #E2E8F0",background:gImporting?"#F1F5F9":"#fff",color:"#1E293B",fontSize:12,fontWeight:600,cursor:gImporting?"wait":"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
              {gImporting?"불러오는 중...":"📥 Google 연락처 가져오기"}
            </button>
            {gImportMsg&&<div style={{fontSize:11,color:gImportMsg.startsWith("✅")?"#059669":gImportMsg.startsWith("❌")?"#DC2626":"#64748B",marginTop:4,textAlign:"center",fontWeight:600}}>{gImportMsg}</div>}
          </div>}
          {contacts.filter(c=>!tabSearch||c.name.toLowerCase().includes(tabSearch.toLowerCase())||c.company?.toLowerCase().includes(tabSearch.toLowerCase())).length===0
            ?<div style={{textAlign:"center",padding:"30px 0",color:"#94A3B8"}}><div style={{fontSize:28}}>👥</div><div style={{fontSize:13,marginTop:4}}>연락처 없음</div></div>
            :<>
            <div style={{fontSize:11,color:"#94A3B8",fontWeight:600,marginBottom:6}}>총 {contacts.filter(c=>!tabSearch||c.name.toLowerCase().includes(tabSearch.toLowerCase())||c.company?.toLowerCase().includes(tabSearch.toLowerCase())).length}명</div>
            <div style={{display:"flex",flexDirection:"column",gap:6}}>
              {contacts.filter(c=>!tabSearch||c.name.toLowerCase().includes(tabSearch.toLowerCase())||c.company?.toLowerCase().includes(tabSearch.toLowerCase())).sort((a,b)=>a.name.localeCompare(b.name)).map(c=>
                <div key={c.id} onClick={()=>{setEditCo(c);setShowCF(true);}} style={{background:"#fff",borderRadius:10,padding:"10px 12px",boxShadow:"0 1px 3px rgba(0,0,0,0.04)",cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
                  <div style={{width:34,height:34,borderRadius:8,background:c.source==="google"?"linear-gradient(135deg,#EA4335,#FBBC04)":"linear-gradient(135deg,#6366F1,#8B5CF6)",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff",fontWeight:700,fontSize:14,flexShrink:0}}>{c.name.charAt(0)}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:13,fontWeight:600,color:"#1E293B",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name}{c.position&&<span style={{fontSize:10,color:"#94A3B8",fontWeight:400}}> {c.position}</span>}{c.source==="google"&&<span style={{fontSize:8,color:"#EA4335",marginLeft:4,fontWeight:700}}>G</span>}</div>
                    <div style={{fontSize:11,color:"#64748B",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.company&&`🏢 ${c.company}`}{c.phone&&` 📱 ${c.phone}`}</div>
                  </div>
                  <div style={{display:"flex",gap:3,flexShrink:0}}>
                    {c.phone&&<a href={`tel:${c.phone}`} onClick={e=>e.stopPropagation()} style={{padding:"4px 7px",borderRadius:6,background:"#DBEAFE",fontSize:11,color:"#2563EB",textDecoration:"none"}}>📞</a>}
                    {c.email&&<a href={`mailto:${c.email}`} onClick={e=>e.stopPropagation()} style={{padding:"4px 7px",borderRadius:6,background:"#F0FDF4",fontSize:11,color:"#059669",textDecoration:"none"}}>📧</a>}
                    {c.phone&&<a href={`sms:${c.phone}`} onClick={e=>e.stopPropagation()} style={{padding:"4px 7px",borderRadius:6,background:"#FEF3C7",fontSize:11,color:"#D97706",textDecoration:"none"}}>💬</a>}
                  </div>
                </div>)}</div>
            </>}
        </>}

        {/* ═══ NEWS ═══ */}
        {tab==="news"&&<NewsTab onSave={saveItem} isItemSaved={isItemSaved} onShare={shareUrl}/>}

        {/* ═══ PUBMED ═══ */}
        {tab==="pubmed"&&<PubMedTab onSave={saveItem} isItemSaved={isItemSaved} onShare={shareUrl}/>}

        {/* ═══ SCRAP ═══ */}
        {tab==="scrap"&&<ScrapTab items={savedItems} onRemove={saveItem} onShare={shareUrl}/>}
      </div>

      {/* FAB - only show for schedule/todo/memo/contacts */}
      {["schedule","todo","memo","contacts"].includes(tab)&&<button onClick={()=>{if(tab==="schedule"){setEditEv(null);setShowEF(true);}else if(tab==="todo"){setEditTd(null);setShowTF(true);}else if(tab==="memo"){setEditMe(null);setShowMF(true);}else{setEditCo(null);setShowCF(true);}}}
        style={{position:"fixed",bottom:20,right:20,width:52,height:52,borderRadius:"50%",border:"none",background:"linear-gradient(135deg,#3B82F6,#6366F1)",color:"#fff",fontSize:26,cursor:"pointer",boxShadow:"0 4px 20px rgba(59,130,246,0.4)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:90}}>+</button>}

      {/* Modals */}
      {showEF&&<EventForm event={editEv} onSave={saveEv} onClose={()=>{setShowEF(false);setEditEv(null);}} onDelete={delEv} contacts={contacts} selectedDate={selDate} onAddContact={()=>{setShowEF(false);setEditCo(null);setShowCF(true);}}/>}
      {showTF&&<TodoForm todo={editTd} onSave={saveTd} onClose={()=>{setShowTF(false);setEditTd(null);}} onDelete={delTd}/>}
      {showMF&&<MemoForm memo={editMe} onSave={saveMe} onClose={()=>{setShowMF(false);setEditMe(null);}} onDelete={delMe} onArchive={archiveMe}/>}
      {showCF&&<ContactForm contact={editCo} onSave={saveCo} onClose={()=>{setShowCF(false);setEditCo(null);}} onDelete={delCo}/>}
      {shareItem&&<ShareModal item={shareItem} onClose={()=>setShareItem(null)} contacts={contacts}/>}
      {showSettings&&<SettingsModal onClose={()=>setShowSettings(false)} events={events} todos={todos} memos={memos} contacts={contacts} routines={routines} savedItems={savedItems} routineItems={routineItems} memoArchive={memoArchive} todoArchive={todoArchive} onRestore={restoreData} doorayStatus={doorayStatus} onDooraySync={()=>syncDooray(events)} user={user} cloudSt={cloudSt} onLogin={login} onLogout={logout} fbReady={fbReady}/>}

      <style>{`
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        input,select,textarea,button{font-family:'Noto Sans KR',sans-serif}
        ::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:3px}
        /* Hide scrollbar on tab bar */
        div::-webkit-scrollbar{height:0;width:0}
        @media(max-width:480px){input,textarea,select{font-size:16px!important}}
        /* Tablet 10-12 inch */
        @media(min-width:768px){
          .bp-main-content{max-width:720px!important}
        }
        /* Notebook */
        @media(min-width:1024px){
          .bp-main-content{max-width:800px!important}
        }
        @media(min-width:1280px){
          .bp-main-content{max-width:900px!important}
        }
      `}</style>
    </div>
  );
}

// ─── Styles ───
const inpS={width:"100%",padding:"9px 12px",borderRadius:8,border:"1.5px solid #E2E8F0",fontSize:14,color:"#1E293B",outline:"none",background:"#F8FAFC",transition:"border-color 0.2s"};
const labS={display:"block",fontSize:10,fontWeight:600,color:"#64748B",marginBottom:2};
const btnS={padding:"9px 16px",borderRadius:8,border:"none",fontWeight:600,fontSize:13,cursor:"pointer",transition:"all 0.15s"};
const closeS={border:"none",background:"none",fontSize:18,cursor:"pointer",color:"#94A3B8",padding:4};
const navS={border:"none",background:"#F1F5F9",borderRadius:7,width:30,height:30,cursor:"pointer",fontSize:13,color:"#475569",display:"flex",alignItems:"center",justifyContent:"center"};
const modalOverlay={position:"fixed",inset:0,background:"rgba(0,0,0,0.45)",backdropFilter:"blur(4px)",display:"flex",justifyContent:"center",alignItems:"center",zIndex:200,padding:12};
const modalCont={background:"#fff",borderRadius:18,padding:20,width:"100%",maxWidth:440,maxHeight:"88vh",overflow:"auto",boxShadow:"0 20px 60px rgba(0,0,0,0.25)"};
const attachBtnS={padding:"6px 10px",borderRadius:6,border:"2px dashed #CBD5E1",background:"#fff",color:"#64748B",fontSize:10,fontWeight:600,cursor:"pointer"};
const searchResultS={display:"flex",alignItems:"center",gap:6,padding:"7px 8px",cursor:"pointer",borderRadius:6,fontSize:12,color:"#1E293B",borderBottom:"1px solid #F8FAFC",transition:"background 0.12s"};

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(BizPlanner));
  </script>
</body>
</html>
